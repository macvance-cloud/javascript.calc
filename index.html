<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loan Calculator</title>
    <style>
        body {
            font-family: Georgia, serif;
            max-width: 480px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 1rem;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            margin-top: 1.25rem;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
        }

        #ans {
            margin-top: 1.25rem;
            padding: 0.75rem;
            background: #f2f2f2;
            font-weight: bold;
        }
    </style>
    <script>
        function calculate() {
            let PV = Number(document.getElementById("pv").value);
            let years = Number(document.getElementById("years").value);
            let annualRate = Number(document.getElementById("rate").value);

            if (PV <= 0 || years <= 0 || annualRate < 0) {
                document.getElementById("ans").innerHTML = "Enter an amount and number of years greater than 0, and an interest rate of 0 or more.";
                return;
            }

            let r = annualRate / 100 / 12; // monthly interest rate
            let n = years * 12;            // number of monthly payments
            let P;

            if (r === 0) {
                P = PV / n;
            } else {
                P = PV * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
            }

            document.getElementById("ans").innerHTML = "IF you take a loan for $" + PV + " your payment will be $" + P.toFixed(2);
        }
    </script>
</head>

<body>

    <h3>Loan Calculator</h3>

    <label for="pv">Present value - the amount you wish to borrow ($)</label>
   <input id="pv" type="text">

    <label for="years">Number of years</label>
    <input id="years" type="text">

    <label for="rate">% - annual interest rate</label>
   <input id="rate" type="text">

    <button onclick="calculate()">Calculate</button>

    <div id="ans"></div>

</body>

</html>
